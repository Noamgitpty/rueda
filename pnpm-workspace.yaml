packages:
  - apps/*
  - packages/*

# Politique de fraîcheur (US-001) : aucune version publiée depuis moins de 14 jours
# (14 j × 24 h × 60 min = 20160 minutes).
minimumReleaseAge: 20160
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
# Correctifs de sécurité transitifs (US-002, porte « dépendances », EXC-002). Les deux paquets
# arrivent par @nestjs/platform-express 12.1.3, qui épingle multer 2.4.0 ; la première version
# de Nest qui tire multer 2.5.0 (12.3.x, publiée le 2026-10-27) reste interdite par
# minimumReleaseAge jusqu'au 2026-11-10. Sélecteurs limités aux versions vulnérables (avis GHSA) :
# retirer ces lignes quand @nestjs/platform-express les tire de lui-même.
overrides:
  # GHSA-27r3-jxmh-p828 (élevée) : body-parser >=2.0.0 <2.4.0, corrigé en 2.4.0.
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  # GHSA-q7qp-rjg7-q26m (élevée) : multer >=2.0.0 <2.5.0, corrigé en 2.5.0.
  'multer@>=2.0.0 <2.5.0': 2.5.0

# TEMPORAIRE (US-025) : mesure du p95 de L0-02 « C1 avec verrou » sur la branche et sur main,
# 5 passages chacun. À retirer avant la fusion.
name: tmp-mesure-l0-02

on:
  pull_request:
    paths: ['.github/workflows/tmp-mesure-l0-02.yml']

permissions:
  contents: read

jobs:
  mesure:
    name: L0-02 ${{ matrix.ref }} passage ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: [branche, main]
        rep: [1, 2, 3, 4, 5]
    env:
      RUEDA_PG_TESTCONTAINERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref == 'main' && 'main' || github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: L0-02 seul
        run: |
          git log --oneline -1
          pnpm --filter @rueda/db exec vitest run --config vitest.l0.config.ts test/l0/l0-02-concurrency.test.ts > l0-02.log 2>&1 || true
          grep -E "\[L0-02\] C1 (avec|transactionnel)|✓|×" l0-02.log | grep -E "C1" || true

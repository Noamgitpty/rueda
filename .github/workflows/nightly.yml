# Régression de nuit (US-002) : rejoue toute la CI sur main, plus les emplacements de nuit.
# Documentation : docs/ops/CI.md.
name: nightly

on:
  schedule:
    # 03:17 UTC chaque nuit (heure décalée de l'heure pleine, moins chargée).
    - cron: '17 3 * * *'
  workflow_dispatch:
  # Autocontrôle : une PR qui modifie ce fichier le rejoue (schedule et workflow_dispatch
  # ne s'appliquent qu'à la branche par défaut).
  pull_request:
    paths: ['.github/workflows/nightly.yml']

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite-complete:
    name: suite complète
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  fuzz-c11:
    name: fuzz C11 (10 000 exécutions, mode long)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Le harnais d'US-005 démarre postgres:16 par Testcontainers sur le Docker du runner (ADR-043).
      RUEDA_PG_TESTCONTAINERS: '1'
      # Mode long explicite (US-025, ADR-068) : 10 000 exécutions ; la CI de chaque fusion garde
      # le mode court par défaut (1 000, `pnpm test:l0`).
      RUEDA_C11_RUNS: nightly
      RUEDA_C11_FAILURES: ${{ github.workspace }}/c11-failures.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Graine de la nuit = date UTC (AAAAMMJJ) : chaque nuit explore d'autres entrelacements ; elle
      # est consignée dans le journal (`[C11] graine`) et chaque échec donne RUEDA_C11_REPLAY.
      - name: graine de la nuit
        run: echo "RUEDA_C11_SEED=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - name: fuzz C11 (pnpm --filter @rueda/db test:c11)
        run: pnpm --filter @rueda/db test:c11
      - name: graines d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c11-failures
          path: c11-failures.jsonl
          if-no-files-found: ignore
          retention-days: 30
